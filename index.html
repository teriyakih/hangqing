<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1D1A">
<title>行情</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap">
<style>
/* 只有行情、没有任何个人信息的小页面。墨色底、金色标题、红涨绿跌（A 股习惯）。 */
:root{
  --bg:#0F1D1A;--panel:#15252180;--fg:#E8EEE9;--muted:#8FA39B;--line:rgba(232,238,233,.12);--gold:#E2B64A;
  --up:#F0776A;--down:#5BC98A;--flat:#8FA39B;
  --serif:'Fraunces',Palatino,'Palatino Linotype','Songti SC',serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:720px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
h1{margin:0;font-family:var(--serif);font-weight:500;font-size:22px;color:var(--gold)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.live i{width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block}
.live.off i{background:#DC2626}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{font:inherit;font-size:14px;padding:8px 14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold);font-weight:600}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.panel[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.q{padding:12px 0 12px;border-bottom:1px solid var(--line);min-width:0}
.qn{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qp{font-family:var(--serif);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px;white-space:nowrap}
.qc{font-size:13px;font-variant-numeric:tabular-nums;margin-top:1px;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.qu{font-size:11px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{font:inherit;font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--fg)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.row .n{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n small{color:var(--muted);font-size:11.5px;margin-left:6px}
.row .p{font-family:var(--serif);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .c{font-size:13.5px;font-variant-numeric:tabular-nums;min-width:5.2em;text-align:right;white-space:nowrap}
.foot{font-size:11.5px;color:var(--muted);line-height:1.6}
.foot .lg .u{color:var(--up)}.foot .lg .d{color:var(--down)}
.empty{color:var(--muted);font-size:14px;padding:14px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>行情</h1>
    <span class="live" id="live"><i></i><span id="live-t">读取中…</span></span>
  </header>
  <div class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" data-tab="market" aria-selected="true">大盘</button>
    <button type="button" class="tab" role="tab" data-tab="stocks" aria-selected="false">股票</button>
    <button type="button" class="tab" role="tab" data-tab="watch" aria-selected="false">关注</button>
  </div>
  <section class="panel" id="p-market" role="tabpanel">
    <div class="grid" id="market"></div>
  </section>
  <section class="panel" id="p-stocks" role="tabpanel" hidden>
    <div class="tools"><span id="stocks-n"></span><span>排序：</span><button type="button" class="chip" data-sort="pct-desc" aria-pressed="true">涨幅</button><button type="button" class="chip" data-sort="pct-asc" aria-pressed="false">跌幅</button><button type="button" class="chip" data-sort="name" aria-pressed="false">名字</button></div>
    <div class="list" id="stocks"></div>
  </section>
  <section class="panel" id="p-watch" role="tabpanel" hidden>
    <div class="list" id="watch"></div>
    <p class="empty" id="watch-empty">还没有关注的。跟 Claude 说「关注 XXX」就加进来。</p>
  </section>
  <p class="foot"><span class="lg"><span class="u">▲ 红涨</span> <span class="d">▼ 绿跌</span></span> · 指数、伦敦金、股票每 15 秒读腾讯行情（A 股收盘后显示收盘价）；比特币 Coinbase、汇率欧洲央行每 5 分钟。这页只有公开行情，没有任何个人信息。</p>
</div>
<script>
(function(){
  // ---- 清单（改这里）
  var MARKET=[
    {code:'hf_XAU',name:'伦敦金',unit:'美元/盎司',kind:'hf'},
    {code:'btc',name:'比特币',unit:'美元',kind:'btc'},
    {code:'s_usDJI',name:'道琼斯'},
    {code:'s_usINX',name:'标普500'},
    {code:'s_usIXIC',name:'纳斯达克'},
    {code:'s_sh000001',name:'上证指数'},
    {code:'s_hkHSI',name:'恒生指数'},
    {code:'usdcny',name:'美元/人民币',kind:'fx'}
  ];
  var STOCKS=[
    ['s_sz000811','冰轮环境'],['s_sz001323','慕思股份'],['s_sz002149','西部材料'],['s_sz002230','科大讯飞'],['s_sz002572','索菲亚'],['s_sz002594','比亚迪'],['s_sz002683','广东宏大'],['s_sz002714','牧原股份'],['s_sz002960','青鸟智控'],['s_sz300124','汇川技术'],['s_sz300213','佳讯飞鸿'],['s_sz300553','集智股份'],['s_sz300636','同和药业'],['s_sz300651','金陵体育'],['s_sz300710','万隆光电'],['s_sz301571','国科天成'],['s_sh600036','招商银行'],['s_sh600111','北方稀土'],['s_sh600346','恒力石化'],['s_sh600363','ST联光'],['s_sh600388','紫金龙净'],['s_sh600741','华域汽车'],['s_sh600745','*ST闻泰'],['s_sh600760','中航沈飞'],['s_sh603606','东方电缆'],['s_sh603822','ST嘉澳'],['s_sh603833','欧派家居'],['s_sh603893','瑞芯微'],['s_sh688084','晶品特装'],['s_sh688226','威腾电气'],['s_sh688282','理工导航'],['s_sh688600','皖仪科技'],['s_sh688639','华恒生物'],['s_sh688726','拉普拉斯'],['s_hk02382','舜宇光学科技']
  ].map(function(x){return {code:x[0],name:x[1]}});
  var WATCH=[];

  var Q={},sort='pct-desc',tab='market',lastAt='';
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=String(text);return e}
  function fmt(n,dec){if(n==null||isNaN(n))return '—';return Number(n).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec})}
  function decFor(p){return p>=1000?0:(p>=100?1:(p>=10?2:(p>=1?3:4)))}
  function cls(pct){return (pct==null||isNaN(pct))?'flat':(pct>0.0001?'up':(pct<-0.0001?'down':'flat'))}
  function arrow(c){return c==='up'?'▲':(c==='down'?'▼':'·')}
  function pctText(pct){var c=cls(pct);return (pct==null||isNaN(pct))?'—':(arrow(c)+' '+(pct>0?'+':'')+Number(pct).toFixed(2)+'%')}

  // ---- 腾讯行情：<script> 跨站读，GBK
  var tScript=null;
  function tencent(codes,done){
    var sc=document.createElement('script');sc.charset='gbk';sc.src='https://qt.gtimg.cn/q='+codes.join(',')+'&_='+Date.now();
    sc.onload=function(){codes.forEach(function(code){var raw=window['v_'+code];if(!raw)return;var f=String(raw).split('~');
        if(code.indexOf('hf_')===0){var p=Number(f[0]),ch=Number(f[1]);if(p>0)Q[code]={price:p,pct:(p-ch)?Math.round(ch/(p-ch)*10000)/100:null}}
        else{var p2=Number(f[3]);if(p2>0)Q[code]={price:p2,pct:Number(f[5]),name:f[1]}}});
      if(tScript&&tScript.parentNode)tScript.parentNode.removeChild(tScript);tScript=sc;lastAt=new Date();done(true)};
    sc.onerror=function(){if(sc.parentNode)sc.parentNode.removeChild(sc);done(false)};
    document.body.appendChild(sc);
  }
  function pollTencent(){
    var codes=MARKET.filter(function(m){return !m.kind||m.kind==='hf'}).map(function(m){return m.code}).concat(STOCKS.map(function(s){return s.code})).concat(WATCH.map(function(s){return s.code}));
    tencent(codes,function(ok){setLive(ok);draw()});
  }
  // ---- 比特币、汇率：公开 API（允许跨站 fetch）
  function pollSlow(){
    var today=new Date(),y=new Date(today.getTime()-86400000);function d(x){return x.toISOString().slice(0,10)}
    Promise.all([fetch('https://api.coinbase.com/v2/prices/BTC-USD/spot').then(function(r){return r.json()}),fetch('https://api.coinbase.com/v2/prices/BTC-USD/spot?date='+d(y)).then(function(r){return r.json()})])
      .then(function(rs){var now=Number(rs[0].data.amount),prev=Number(rs[1].data.amount);if(now>0)Q.btc={price:now,pct:prev>0?Math.round((now-prev)/prev*10000)/100:null};draw()}).catch(function(){});
    fetch('https://api.frankfurter.dev/v1/latest?from=USD&to=CNY').then(function(r){return r.json()}).then(function(j){if(j&&j.rates&&j.rates.CNY)Q.usdcny={price:Number(j.rates.CNY),pct:null,asof:j.date};draw()}).catch(function(){});
  }
  function setLive(ok){var l=document.getElementById('live'),t=document.getElementById('live-t');l.classList.toggle('off',!ok);t.textContent=(ok?'实时 · ':'这次没读到 · 上次 ')+(lastAt?new Date(lastAt).toLocaleTimeString('zh-CN',{hour12:false}):'—')}

  function draw(){
    var m=document.getElementById('market');m.innerHTML='';
    MARKET.forEach(function(x){var q=Q[x.code]||{};var d=el('div','q');d.appendChild(el('div','qn',x.name));d.appendChild(el('div','qp',q.price?fmt(q.price,decFor(q.price)):'—'));d.appendChild(el('div','qc '+cls(q.pct),q.price?pctText(q.pct):'读取中…'));if(x.unit||q.asof)d.appendChild(el('div','qu',(x.unit||'')+(q.asof?'（'+q.asof+'）':'')));m.appendChild(d)});
    function list(box,items){
      box.innerHTML='';var rows=items.map(function(x){var q=Q[x.code]||{};return {code:x.code,name:q.name||x.name,price:q.price,pct:q.pct}});
      rows.sort(function(a,b){if(sort==='name')return String(a.name).localeCompare(String(b.name),'zh');var pa=(a.pct==null||isNaN(a.pct))?-999:a.pct,pb=(b.pct==null||isNaN(b.pct))?-999:b.pct;return sort==='pct-asc'?(pa-pb):(pb-pa)});
      rows.forEach(function(r){var row=el('div','row');var n=el('span','n',r.name);var sm=el('small','',r.code.replace(/^s_/,'').toUpperCase());n.appendChild(sm);row.appendChild(n);row.appendChild(el('span','p',r.price?fmt(r.price,decFor(r.price)):'—'));row.appendChild(el('span','c '+cls(r.pct),r.price?pctText(r.pct):'…'));box.appendChild(row)});
    }
    list(document.getElementById('stocks'),STOCKS);document.getElementById('stocks-n').textContent=STOCKS.length+' 只';
    list(document.getElementById('watch'),WATCH);document.getElementById('watch-empty').hidden=!!WATCH.length;
  }
  function showTab(t){tab=t;document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',String(b.getAttribute('data-tab')===t))});['market','stocks','watch'].forEach(function(k){document.getElementById('p-'+k).hidden=(k!==t)});try{localStorage.setItem('hq-tab',t)}catch(e){}}
  document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){showTab(b.getAttribute('data-tab'))})});
  document.querySelectorAll('.chip[data-sort]').forEach(function(b){b.addEventListener('click',function(){sort=b.getAttribute('data-sort');document.querySelectorAll('.chip[data-sort]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});draw()})});
  try{var t0=localStorage.getItem('hq-tab');if(t0)showTab(t0)}catch(e){}
  draw();pollTencent();pollSlow();setInterval(pollTencent,15000);setInterval(pollSlow,300000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden){pollTencent();pollSlow()}});
})();
</script>
</body>
</html>
